name: API Ownership Boundary (review-only)

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-ownership-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Parse production API source without loading models or credentials
        run: python -m compileall -q api
      - name: Validate auth policy and route wiring
        run: python -m unittest discover -s tests_api_boundary -p 'test_*.py' -v

  api-http-with-fake-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated API test dependencies only
        run: >-
          python -m pip install
          "fastapi==0.128.2" "httpx==0.28.1"
          "pydantic==2.13.5" "uvicorn==0.48.0"
          "python-dotenv==1.2.2" "loguru==0.7.3"
      - name: Exercise real HTTP route authorization with a fake local Agent
        run: python -m unittest discover -s tests_api_boundary -p 'test_api_http_access.py' -v
